<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food & Stories - Share Your Culinary Journey</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  
  <div class="app">
    <!-- Sidebar with countries -->
    <div class="sidebar"></div>
    
    <!-- Main content area -->
    <div class="main">
      
      <!-- Header with greeting -->
      <div class="header"></div>
      
      <!-- Post creation form (3D card) -->
      <form id="postForm" class="post-form">
        <input 
          type="text" 
          name="title" 
          placeholder="📝 Title of your food story..." 
          required
        >
        
        <input 
          type="text" 
          name="author" 
          placeholder="👤 Your name (or stay anonymous)" 
        >
        
        <textarea 
          name="content" 
          placeholder="✍️ Share your culinary experience, recipe, or food memory..." 
          required
        ></textarea>
        
        <input 
          type="file" 
          name="media" 
          accept="image/*,video/*"
        >
        
        <button type="submit">🚀 Share Your Story</button>
      </form>
      
      <!-- Posts grid for current country -->
      <div class="posts-section">
        <h2>✨ Featured Stories</h2>
        <div class="posts"></div>
      </div>
      
      <!-- All posts section at bottom -->
      <div class="all-posts-section">
        <h2>🌍 All Food Stories</h2>
        <div class="all-posts posts"></div>
      </div>
      
    </div>
  </div>
  
  <!-- Scripts -->
  <script src="js/countries.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/app.js"></script>
  
</body>
</html>
