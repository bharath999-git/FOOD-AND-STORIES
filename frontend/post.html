<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Detail - Food & Stories</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  
  <div class="app">
    <!-- Sidebar -->
    <div class="sidebar"></div>
    
    <!-- Main content with overlay -->
    <div class="main">
      
      <!-- Post detail container -->
      <div class="post-detail" id="postDetail">
        <p style="text-align: center; color: var(--text-secondary);">Loading...</p>
      </div>
      
    </div>
  </div>
  
  <script src="js/countries.js"></script>
  <script src="js/theme.js"></script>
  <script>
    const API = "http://localhost:5000/api/posts";
    let currentPost = null;
    
    const main = document.querySelector(".main");
    const sidebar = document.querySelector(".sidebar");
    const postDetail = document.getElementById("postDetail");
    
    // Get post ID from URL
    const urlParams = new URLSearchParams(window.location.search);
    const postId = urlParams.get('id');
    
    // ============================================
    // RENDER SIDEBAR
    // ============================================
    
    function renderSidebar() {
      sidebar.innerHTML = `
        <div class="sidebar-header">
          <h2>🍽️ Food & Stories</h2>
          <p>Explore Global Cuisines</p>
        </div>
        <a href="index.html" style="display: block; padding: 15px; text-align: center; background: var(--card-bg); border-radius: 12px; text-decoration: none; color: var(--text-primary); font-weight: 600; margin-bottom: 20px;">← Back to Home</a>
      `;
      
      Object.keys(COUNTRIES).forEach(key => {
        const c = COUNTRIES[key];
        const div = document.createElement("div");
        div.className = "country";
        div.innerHTML = `${c.emoji} ${c.name}`;
        div.style.color = c.color;
        div.style.borderColor = c.color;
        div.onclick = () => {
          window.location.href = 'index.html';
        };
        sidebar.appendChild(div);
      });
    }
    
    // ============================================
    // LOAD POST
    // ============================================
    
    async function loadPost() {
      if (!postId) {
        postDetail.innerHTML = `
          <div style="text-align: center; padding: 60px;">
            <h2>❌ Post not found</h2>
            <p>The post you're looking for doesn't exist.</p>
            <a href="index.html" style="display: inline-block; margin-top: 20px; padding: 12px 30px; background: #667eea; color: white; text-decoration: none; border-radius: 25px;">Go Home</a>
          </div>
        `;
        return;
      }
      
      try {
        const res = await fetch(`${API}/${postId}`);
        
        if (!res.ok) {
          throw new Error("Post not found");
        }
        
        currentPost = await res.json();
        renderPost();
        
      } catch (err) {
        console.error("Error loading post:", err);
        postDetail.innerHTML = `
          <div style="text-align: center; padding: 60px;">
            <h2>❌ Error loading post</h2>
            <p>Could not load the post. Make sure backend is running!</p>
            <a href="index.html" style="display: inline-block; margin-top: 20px; padding: 12px 30px; background: #667eea; color: white; text-decoration: none; border-radius: 25px;">Go Home</a>
          </div>
        `;
      }
    }
    
    // ============================================
    // RENDER POST
    // ============================================
    
    function renderPost() {
      const country = COUNTRIES[currentPost.region];
      const postColor = country ? country.color : '#667eea';
      
      // Update background with country overlay
      if (country) {
        main.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)), url(${country.overlay})`;
      }
      
      postDetail.innerHTML = `
        <h1>${currentPost.title}</h1>
        
        <div class="meta">
          <span>👤 ${currentPost.author}</span>
          <span>${country ? country.emoji + ' ' + country.name : currentPost.region}</span>
          <span>📅 ${new Date(currentPost.createdAt).toLocaleDateString()}</span>
        </div>
        
        ${currentPost.media ? `
          <img src="http://localhost:5000${currentPost.media}" alt="${currentPost.title}">
        ` : ''}
        
        <div class="content">${currentPost.content}</div>
        
        <div class="post-actions">
          <button class="edit-btn" onclick="editPost()">✏️ Edit Post</button>
          <button class="delete-btn" onclick="deletePost()">🗑️ Delete Post</button>
        </div>
      `;
    }
    
    // ============================================
    // EDIT POST
    // ============================================
    
    async function editPost() {
      const newTitle = prompt("Edit title:", currentPost.title);
      if (!newTitle) return;
      
      const newContent = prompt("Edit content:", currentPost.content);
      if (!newContent) return;
      
      try {
        const res = await fetch(`${API}/${postId}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            title: newTitle,
            content: newContent
          })
        });
        
        if (res.ok) {
          alert("✅ Post updated successfully!");
          await loadPost();
        } else {
          alert("❌ Error updating post");
        }
      } catch (err) {
        console.error("Error updating post:", err);
        alert("❌ Error updating post. Make sure backend is running!");
      }
    }
    
    // ============================================
    // DELETE POST
    // ============================================
    
    async function deletePost() {
      if (!confirm("Are you sure you want to delete this post? This action cannot be undone.")) {
        return;
      }
      
      try {
        const res = await fetch(`${API}/${postId}`, {
          method: "DELETE"
        });
        
        if (res.ok) {
          alert("✅ Post deleted successfully!");
          window.location.href = "index.html";
        } else {
          alert("❌ Error deleting post");
        }
      } catch (err) {
        console.error("Error deleting post:", err);
        alert("❌ Error deleting post. Make sure backend is running!");
      }
    }
    
    // ============================================
    // INITIALIZE
    // ============================================
    
    renderSidebar();
    loadPost();
  </script>
  
</body>
</html>
